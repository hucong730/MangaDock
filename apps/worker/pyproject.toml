[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadock-worker"
version = "0.1.0"
description = "Celery worker for MangaDock"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4,<6",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
