[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadock-providers"
version = "0.1.0"
description = "Model-independent providers for MangaDock"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "respx>=0.22,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mangadock_providers = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=mangadock_providers --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
exclude_lines = [
  "@abstractmethod",
]
